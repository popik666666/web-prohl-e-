<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shinto Browster - Vyhledávače dle kategorií (V3.1 - Torrents)</title>
<style>
  :root {
    --bg-dark: #000;
    --panel-dark: #111;
    --accent-dark: #c41616;
    --text-dark: #eee;
    --muted-dark: #888;

    --bg-light: #fff;
    --panel-light: #eee;
    --accent-light: #c41616;
    --text-light: #000;
    --muted-light: #555;
  }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  body.dark {
    --bg: var(--bg-dark);
    --panel: var(--panel-dark);
    --accent: var(--accent-dark);
    --text: var(--text-dark);
    --muted: var(--muted-dark);
  }
  body.light {
    --bg: var(--bg-light);
    --panel: var(--panel-light);
    --accent: var(--accent-light);
    --text: var(--text-light);
    --muted: var(--muted-light);
  }
  header {
    background: var(--panel);
    padding: 1em;
    text-align: center;
    font-size: 1.5em;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(196,22,22,0.5);
  }
  main {
    max-width: 900px;
    margin: auto;
    padding: 1em;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 1em;
  }
  input[type=text] {
    flex: 1 1 200px;
    padding: 0.8em;
    font-size: 1em;
    border-radius: 8px;
    border: 1px solid #ccc;
    transition: border-color 0.3s;
    background-color: var(--panel); 
    color: var(--text);
  }
  input[type=text]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 700;
    padding: 0.8em 1.2em;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:disabled {
    background: #555;
    cursor: not-allowed;
  }
  button.secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--muted);
  }
  body.light button.secondary {
    background: #ccc;
    color: #000;
  }
  h2 {
    border-bottom: 2px solid var(--accent);
    padding-bottom: 0.3em;
    margin-top: 2em;
  }
  .engine-list {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
    gap: 12px;
  }
  .engine-card {
    background: var(--panel);
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    padding: 0.7em;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background 0.3s;
  }
  .engine-card:hover {
    background: var(--accent);
    color: #fff;
  }
  .engine-card:hover .engine-url {
    color: #fff;
  }
  .engine-logo {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    flex-shrink: 0;
    font-size: 28px;
    font-weight: 900;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
  }
  .engine-info {
    flex-grow: 1;
  }
  .engine-name {
    font-weight: 700;
    font-size: 1.1em;
  }
  .engine-url {
    font-size: 0.85em;
    color: var(--muted);
    word-break: break-all;
  }
  .engine-actions button {
    margin-left: 6px;
    font-size: 0.85em;
    padding: 0.4em 0.7em;
    border-radius: 8px;
  }
  .section-container {
    margin-bottom: 2em;
  }
  .category-actions {
    margin-top: 10px;
  }
  .category-actions button {
    margin-right: 8px;
  }
  footer {
    text-align: center;
    margin: 2em 0 1em;
    font-size: 0.9em;
    color: var(--muted);
  }
</style>
</head>
<body class="dark">

    <button id="toggleThemeBtn" class="secondary">Světlo / Tma</button>

  function createEngineCard(engine, query) {
    const card = document.createElement('div');
    card.className = 'engine-card';

    const logo = document.createElement('div');
    logo.className = 'engine-logo';
    logo.style.backgroundColor = engine.bg;
    logo.style.color = engine.fg || '#fff';
    logo.textContent = engine.icon;
    card.appendChild(logo);

    const info = document.createElement('div');
    info.className = 'engine-info';

    const name = document.createElement('div');
    name.className = 'engine-name';
    name.textContent = engine.name;
    info.appendChild(name);

    const urlEl = document.createElement('div');
    urlEl.className = 'engine-url';
    
    if (!engine.url(query).includes('example.onion') && !engine.url(query).includes('.onion/')) {
        urlEl.textContent = engine.url(query);
    } else {
        urlEl.textContent = 'TOR/Darknet URL (pouze Tor Browser)';
    }
    info.appendChild(urlEl);

    card.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'engine-actions';

    const openBtn = document.createElement('button');
    openBtn.textContent = 'Otevřít';
    
    if (!engine.url(query).includes('example.onion') && !engine.url(query).includes('.onion/')) {
        openBtn.onclick = () => window.open(engine.url(query), '_blank');
    } else {
        openBtn.disabled = true;
        openBtn.textContent = 'TOR only';
    }
    actions.appendChild(openBtn);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'secondary';
    copyBtn.textContent = 'Kopírovat';
    copyBtn.onclick = () => {
      const urlToCopy = (engine.url(query).includes('example.onion') || engine.url(query).includes('.onion/'))
                        ? 'TOR/Darknet adresa (nutný Tor Browser): ' + engine.url(query) 
                        : engine.url(query);
                        
      if (navigator.clipboard) {
        navigator.clipboard.writeText(urlToCopy)
          .then(() => alert('URL zkopírováno'))
          .catch(() => fallbackCopy(urlToCopy));
      } else {
        fallbackCopy(urlToCopy);
      }
    };
    actions.appendChild(copyBtn);

    card.appendChild(actions);

    return card;
  }

  function fallbackCopy(text) {
    const dummy = document.createElement('textarea');
    document.body.appendChild(dummy);
    dummy.value = text;
    dummy.select();
    document.execCommand('copy');
    document.body.removeChild(dummy);
    alert('URL zkopírováno (fallback)');
  }

          h1 { color: #c41616; border-bottom: 3px solid #c41616; padding-bottom: 10px; text-shadow: 0 0 8px rgba(196,22,22,0.5); }
          h2 { color: #eee; margin-top: 30px; font-size: 1.5em; border-bottom: 1px solid #333; padding-bottom: 5px; }
          .result-list { list-style: none; padding: 0; }
          .result-list li { margin-bottom: 15px; background: #111; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
          .result-list li:hover { background: #222; }
          .result-list li a { color: #4285F4; text-decoration: none; font-weight: bold; font-size: 1.1em; }
          .result-list li a:hover { color: #ff0000; }
          .source { font-size: 0.85em; color: #888; display: block; word-break: break-all; margin-top: 5px; }
          .logo-icon { margin-right: 10px; font-size: 1.2em; }
          .tor-note { color: #c41616; font-weight: bold; }
        </style>
      </head>
      <body>
        <h1>Sloučené výsledky pro dotaz: "${query}"</h1>
        <p style="color: #aaa;">Klikněte na název vyhledávače pro otevření výsledku v nové kartě.</p>
    `;

    for (const categoryName in categories) {
      htmlContent += `<h2>${categoryName}</h2><ul class="result-list">`;
      categories[categoryName].forEach(engine => {
        const url = engine.url(query);
        const isTor = url.includes('.onion') || url.includes('example.onion') || url.includes('.onion/');

        const urlDisplay = isTor
                           ? 'TOR/Darknet URL (Nelze otevřít z Clearnetu)' 
                           : url;
        
        const linkStyle = isTor ? 'style="color: #c41616;"' : '';
        const href = isTor ? '#' : url;
        const target = isTor ? '' : 'target="_blank"';

        htmlContent += `
          <li>
            <span class="logo-icon" style="color:${engine.fg || '#fff'}; background-color:${engine.bg}; padding: 3px 6px; border-radius: 4px;">${engine.icon}</span>
            <a href="${href}" ${target} ${linkStyle}>${engine.name} - Otevřít</a>
            <span class="source">${isTor ? '<span class="tor-note">' + urlDisplay + '</span>' : urlDisplay}</span>
          </li>
        `;
      });
      htmlContent += `</ul>`;
    }

    htmlContent += `<p style="text-align: center; color: #555; margin-top: 50px;">Shinto © 2026</p></body></html>`;
    return htmlContent;
  }

  function renderResults(query) {
    resultsContainer.innerHTML = '';
    if (!query.trim()) {
      resultsContainer.innerHTML = '<p>Zadej dotaz a klikni Hledat.</p>';
      openSummaryBtn.disabled = true;
      return;
    }

    for (const categoryName in categories) {
      const section = document.createElement('section');
      section.className = 'section-container';

      const heading = document.createElement('h2');
      heading.textContent = categoryName;
      section.appendChild(heading);

      const list = document.createElement('div');
      list.className = 'engine-list';

      categories[categoryName].forEach(engine => {
        engine.category = categoryName; 
        list.appendChild(createEngineCard(engine, query));
      });

      section.appendChild(list);
      
      const categoryActions = document.createElement('div');
      categoryActions.className = 'category-actions';

      const categoryOpenAllBtn = document.createElement('button');
      categoryOpenAllBtn.textContent = `Otevřít Vše v nových kartách (${categoryName.split(' ')[0]})`;
      categoryOpenAllBtn.className = 'secondary';
      categoryOpenAllBtn.onclick = () => {
          const enginesToOpen = categories[categoryName].filter(e => !e.url(query).includes('example.onion') && !e.url(query).includes('.onion/'));
          enginesToOpen.forEach(engine => {
              window.open(engine.url(query), '_blank');
          });
          if (enginesToOpen.length < categories[categoryName].length) {
              alert('TOR/Darknet odkazy byly vynechány, protože vyžadují Tor Browser.');
          }
      };
      categoryActions.appendChild(categoryOpenAllBtn);

      section.appendChild(categoryActions);
      
      resultsContainer.appendChild(section);
    }

    openSummaryBtn.disabled = false;
  }

  searchBtn.addEventListener('click', () => {
    renderResults(searchInput.value);
  });

  openSummaryBtn.addEventListener('click', () => {
    const query = searchInput.value.trim();
    if (!query) {
      alert('Zadej dotaz');
      return;
    }
    const summaryHtml = createSummaryHTML(query);
    const dataUrl = 'data:text/html;charset=utf-8,' + encodeURIComponent(summaryHtml);
    window.open(dataUrl, '_blank');
  });

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      searchBtn.click();
    }
  });

  toggleThemeBtn.addEventListener('click', () => {
    if (document.body.classList.contains('dark')) {
      document.body.classList.remove('dark');
      document.body.classList.add('light');
    } else {
      document.body.classList.remove('light');
      document.body.classList.add('dark');
    }
  });

})();
</script>
</body>
</html>
